<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="nlp-title nlp-desc">
  <title id="nlp-title">NLP insight engine pipeline for customer reviews</title>
  <desc id="nlp-desc">Large-scale customer reviews are preprocessed, encoded into transformer embeddings, clustered with k-means, and reduced to ranked themes and sentiment.</desc>

  <defs>
    <style>
      .lbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #edfffe; }
      .sub { font-family: ui-monospace, monospace; font-size: 10px; fill: #93a3a2; letter-spacing: .08em; }
      .cap { font-family: ui-monospace, monospace; font-size: 10px; fill: #2ef4eb; letter-spacing: .16em; }
      .node { fill: #003734; stroke: rgba(255,255,255,.10); }
      .flow { stroke: #2ef4eb; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="nlp-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2ef4eb"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#011d1c"/>
  <text x="28" y="40" class="cap">METHOD PIPELINE</text>

  <!-- 1. raw reviews -->
  <rect x="28" y="86" width="124" height="104" rx="8" class="node"/>
  <g transform="translate(52,108)" opacity=".9">
    <rect x="0" y="0" width="76" height="9" rx="4" fill="#cbfffc" opacity=".55"/>
    <rect x="0" y="16" width="60" height="9" rx="4" fill="#cbfffc" opacity=".40"/>
    <rect x="0" y="32" width="70" height="9" rx="4" fill="#cbfffc" opacity=".55"/>
    <rect x="0" y="48" width="48" height="9" rx="4" fill="#cbfffc" opacity=".30"/>
  </g>
  <text x="90" y="208" class="lbl" text-anchor="middle">Raw Reviews</text>
  <text x="90" y="224" class="sub" text-anchor="middle">UNSTRUCTURED TEXT</text>

  <!-- 2. preprocessing -->
  <rect x="176" y="86" width="124" height="104" rx="8" class="node"/>
  <g transform="translate(212,112)" stroke="#2ef4eb" stroke-width="1.4" fill="none">
    <path d="M2 6h48M2 20h34M2 34h44"/>
    <path d="M8 46l10 10 22-24" stroke="#fde9ff" stroke-width="2"/>
  </g>
  <text x="238" y="208" class="lbl" text-anchor="middle">Preprocessing</text>
  <text x="238" y="224" class="sub" text-anchor="middle">CLEAN / TOKENISE</text>

  <!-- 3. embeddings -->
  <rect x="324" y="86" width="124" height="104" rx="8" class="node"/>
  <g transform="translate(348,110)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#2ef4eb" opacity=".85"/>
    <rect x="20" y="0" width="16" height="16" rx="3" fill="#cbfffc" opacity=".55"/>
    <rect x="40" y="0" width="16" height="16" rx="3" fill="#2ef4eb" opacity=".45"/>
    <rect x="60" y="0" width="16" height="16" rx="3" fill="#fde9ff" opacity=".70"/>
    <rect x="0" y="20" width="16" height="16" rx="3" fill="#cbfffc" opacity=".40"/>
    <rect x="20" y="20" width="16" height="16" rx="3" fill="#2ef4eb" opacity=".75"/>
    <rect x="40" y="20" width="16" height="16" rx="3" fill="#fde9ff" opacity=".50"/>
    <rect x="60" y="20" width="16" height="16" rx="3" fill="#cbfffc" opacity=".65"/>
    <rect x="0" y="40" width="16" height="16" rx="3" fill="#2ef4eb" opacity=".55"/>
    <rect x="20" y="40" width="16" height="16" rx="3" fill="#fde9ff" opacity=".35"/>
    <rect x="40" y="40" width="16" height="16" rx="3" fill="#cbfffc" opacity=".80"/>
    <rect x="60" y="40" width="16" height="16" rx="3" fill="#2ef4eb" opacity=".40"/>
  </g>
  <text x="386" y="208" class="lbl" text-anchor="middle">Embeddings</text>
  <text x="386" y="224" class="sub" text-anchor="middle">TRANSFORMER / BERT</text>

  <!-- 4. clustering -->
  <rect x="472" y="86" width="140" height="104" rx="8" class="node" stroke="rgba(253,233,255,.35)"/>
  <g transform="translate(496,104)">
    <circle cx="14" cy="14" r="3.5" fill="#2ef4eb"/><circle cx="24" cy="9" r="3.5" fill="#2ef4eb"/><circle cx="20" cy="22" r="3.5" fill="#2ef4eb"/>
    <circle cx="70" cy="16" r="3.5" fill="#fde9ff"/><circle cx="80" cy="24" r="3.5" fill="#fde9ff"/><circle cx="72" cy="30" r="3.5" fill="#fde9ff"/>
    <circle cx="30" cy="54" r="3.5" fill="#cbfffc"/><circle cx="42" cy="60" r="3.5" fill="#cbfffc"/><circle cx="33" cy="66" r="3.5" fill="#cbfffc"/>
    <circle cx="78" cy="58" r="3.5" fill="#edfffe"/><circle cx="88" cy="64" r="3.5" fill="#edfffe"/>
    <ellipse cx="19" cy="15" rx="17" ry="14" fill="none" stroke="#2ef4eb" stroke-width="1" opacity=".45"/>
    <ellipse cx="74" cy="23" rx="16" ry="14" fill="none" stroke="#fde9ff" stroke-width="1" opacity=".45"/>
    <ellipse cx="35" cy="60" rx="16" ry="13" fill="none" stroke="#cbfffc" stroke-width="1" opacity=".45"/>
  </g>
  <text x="542" y="208" class="lbl" text-anchor="middle">Themes + Sentiment</text>
  <text x="542" y="224" class="sub" text-anchor="middle">K-MEANS CLUSTERING</text>

  <!-- flows -->
  <path class="flow" d="M152 138 H172" marker-end="url(#nlp-ar)"/>
  <path class="flow" d="M300 138 H320" marker-end="url(#nlp-ar)"/>
  <path class="flow" d="M448 138 H468" marker-end="url(#nlp-ar)"/>

  <line x1="28" y1="284" x2="612" y2="284" stroke="rgba(255,255,255,.08)"/>
  <text x="28" y="308" class="sub">TRANSFORMERS</text>
  <text x="150" y="308" class="sub">BERT FINE-TUNING</text>
  <text x="298" y="308" class="sub">TEXT CLUSTERING</text>
  <text x="428" y="308" class="sub">SENTIMENT EXTRACTION</text>
</svg>
